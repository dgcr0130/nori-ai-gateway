{{- include "aigw.guard" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "aigw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "aigw.labels" . | nindent 8 }}
      annotations:
        checksum/app-config: {{ .Values.appConfig | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.common.userId }}
        runAsGroup: {{ .Values.common.groupId }}
        fsGroup: {{ .Values.common.groupId }}
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      containers:
        - name: gateway
          image: "{{ .Values.global.registry }}/{{ .Values.common.projectName }}/{{ .Values.app.name }}:{{ .Values.app.imageTag }}"
          imagePullPolicy: {{ .Values.app.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.app.containerPort }}
          resources:
            limits:
              memory: {{ .Values.app.resources.limits.memory | quote }}
              cpu: {{ .Values.app.resources.limits.cpu | quote }}
            requests:
              memory: {{ .Values.app.resources.requests.memory | quote }}
              cpu: {{ .Values.app.resources.requests.cpu | quote }}
          {{- range $name := list "liveness" "readiness" "startup" }}
          {{ $name }}Probe:
            httpGet:
              path: {{ (index $.Values.probes $name).path }}
              port: http
            initialDelaySeconds: {{ (index $.Values.probes $name).initialDelaySeconds }}
            periodSeconds: {{ (index $.Values.probes $name).periodSeconds }}
            failureThreshold: {{ (index $.Values.probes $name).failureThreshold }}
            timeoutSeconds: {{ (index $.Values.probes $name).timeoutSeconds }}
          {{- end }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.app.profile | quote }}
            {{- range $key := list "AI_GATEWAY_DB_USER" "AI_GATEWAY_DB_PASSWORD" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.configSecret.name }}
                  key: {{ $key }}
            {{- end }}
            # 실제 필수 소비자인 CapacityProfile과 추론 빈 조건에 고정 운영값을 줍니다.
            - name: AI_GATEWAY_INFERENCE_MODE
              value: enabled
            - name: AI_GATEWAY_CAPACITY_MAX_RUNNING_JOBS
              value: "1"
            - name: AI_GATEWAY_CAPACITY_GENERATION_CONCURRENCY
              value: "1"
            - name: AI_GATEWAY_CAPACITY_QUEUED_DEPTH
              value: "4"
            - name: AI_GATEWAY_CAPACITY_QUEUE_WAIT_LIMIT
              value: 60s
            - name: AI_GATEWAY_CAPACITY_JOB_LIFETIME_LIMIT
              value: 180s
            - name: DJL_CACHE_DIR
              value: /tmp/djl
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /app/config, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
        - name: config
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ .Values.configSecret.name }}
              - configMap:
                  name: {{ .Release.Name }}-app-config
