global:
  registry: harbor.nori.local
  namespace: tc
  imagePullSecret: harbor-pull-secret
common:
  projectName: nori-tc
  userId: 3000
  groupId: 2000
app:
  name: ai-gateway
  imageTag: ""
  imagePullPolicy: IfNotPresent
  replicaCount: 1
  profile: prod
  containerPort: 8080
service:
  type: ClusterIP
  port: 8080
configSecret:
  create: false
  name: ai-gateway-config
# CI가 저장소의 config/ai-gateway.yaml을 --set-file로 전달합니다.
appConfig: ""
systems: {}
netpol:
  targets: {}
probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 3
    timeoutSeconds: 3
  # 문서 동기화는 readiness를 닫지만 liveness를 닫지 않습니다.
  startup:
    path: /actuator/health/liveness
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 180
    timeoutSeconds: 5
