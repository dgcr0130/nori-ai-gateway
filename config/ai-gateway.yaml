# 자격 파일 경로와 검토 권한 코드는 배포 환경에서 공급합니다. 비밀 본문은 이 파일에 두지 않습니다.
ai:
  gateway:
    systems:
      TC:
        issuer: tc-ui-backend
        serviceTokenSha256File: ${AI_GATEWAY_TC_SERVICE_TOKEN_SHA256_FILE:/app/config/tc-service-token-sha256}
        actorJwksFile: ${AI_GATEWAY_TC_ACTOR_JWKS_FILE:/app/config/tc-actor-jwks.json}
        reviewPermission: AI_REVIEW
        backendUrl: http://tc-ui-backend.tc.svc:8080
        gatewayTokenFile: ${AI_GATEWAY_TC_GATEWAY_TOKEN_FILE:/app/config/tc-gateway-token}
        intents:
          - {id: registration, description: "설비 식별자로 지목한 특정 호기의 실제 등록값(통신 설정·모델 연결·파라미터·로그 정책·JAR 등) 조회. 호기를 식별할 수 없으면 subject는 null.", toolIds: [tc.eqp.readRegistration], subjectRequired: true, periodRequirement: NONE, taskType: LIVE_QUERY, documentSearch: false}
          - {id: connection, description: "지정 설비의 관측된 연결 상태만 조회. 예: '그럼 해당 설비의 현재 연결 상태가 어때', 'ETC_001 연결됐어?'. 이전 턴에서 특정한 설비를 subject로 사용하되 불명확하면 null. 작업·LOT·전체 운영 상태를 함께 묻는 질문은 status로 분류.", toolIds: [tc.eqp.getConnectionState], subjectRequired: true, periodRequirement: NONE, taskType: LIVE_QUERY, documentSearch: false}
          - {id: status, description: "설비의 전체 운영 상태·작업·LOT 조회 또는 여러 설비 운영 상태 비교. 예: 'ETC_001 전체 운영 상태', '연결 상태와 현재 LOT를 함께 알려줘'. 연결+LOT 복합 질문은 이 의도로 전체 범위를 조회하고, 연결만 묻는 질문은 connection으로 분류.", toolIds: [tc.eqp.getOperationalSnapshot], subjectRequired: true, periodRequirement: NONE, taskType: LIVE_QUERY, documentSearch: false}
          - {id: model, description: "설비에 연결된 모델·워크플로·메시지 정의 조회", toolIds: [tc.model.read], subjectRequired: true, periodRequirement: NONE, taskType: LIVE_QUERY, documentSearch: false}
          - {id: dlq, description: "설비의 DLQ 목록 조회. 기간이 없어도 조회 가능", toolIds: [tc.dlq.list], subjectRequired: true, periodRequirement: OPTIONAL, taskType: LIVE_QUERY, documentSearch: false}
          - {id: communication, description: "특정 설비가 실제로 주고받은 메시지의 시각·데이터·통신 기록 조회. 등록된 설정값 조회와 구분.", toolIds: [tc.commLogs.search], subjectRequired: true, periodRequirement: REQUIRED, taskType: LIVE_QUERY, documentSearch: false}
          - {id: incident, description: "서비스 에러·장애 원인을 로그와 추적으로 조사", toolIds: [logs.search, trace.search], subjectRequired: false, periodRequirement: REQUIRED, taskType: INCIDENT_ANALYSIS, documentSearch: false}
          - {id: document, description: "화면·옵션·설정 항목의 의미와 사용·등록 방법 설명. 특정 설비의 실제 등록값·상태·메시지 기록 조회와 구분.", toolIds: [], subjectRequired: false, periodRequirement: NONE, taskType: KNOWLEDGE_QUERY, documentSearch: true}
          - {id: help, description: "질문 가능한 기능과 지원 범위 안내", toolIds: [], subjectRequired: false, periodRequirement: NONE, taskType: GENERAL_QUERY, documentSearch: false}
          - {id: unsupported, description: "생성·수정·삭제·설정 변경 등 쓰기 실행 요구 또는 등록된 조회·설명 의도로 처리할 수 없는 요청", toolIds: [], subjectRequired: false, periodRequirement: NONE, taskType: UNSUPPORTED_REQUEST, documentSearch: false}
          - {id: code, description: "프로그램 식별자의 정의·참조·호출 위치와 이벤트·메시지 처리 담당 로직을 소스 파일에서 탐색. subject는 클래스·함수·상수·설정 키 등의 이름.", toolIds: [git.searchCode], subjectRequired: true, subjectKind: CODE_TERM, periodRequirement: NONE, taskType: LIVE_QUERY, documentSearch: false}
        tools:
          - {"id":"tc.eqp.getConnectionState","description":"지정 설비의 DB에 관측된 연결·런타임 상태 조회. 설비에 새로 접속 확인하지 않으며 작업·LOT는 조회하지 않음","inputSchema":{"type":"object","properties":{"eqp":{"type":"string","minLength":1,"maxLength":64}},"required":["eqp"],"additionalProperties":false},"outputSchema":{"type":"object"},"requiredPermissions":["EQP_READ"],"timeoutMs":10000}
          - {"id":"tc.eqp.readRegistration","description":"설비 등록 정보 조회","inputSchema":{"type":"object","properties":{"eqp":{"type":"string","minLength":1,"maxLength":64}},"required":["eqp"],"additionalProperties":false},"outputSchema":{"type":"object"},"requiredPermissions":["EQP_READ"],"timeoutMs":10000}
          - {"id":"tc.eqp.getOperationalSnapshot","description":"설비 운영 상태 조회","inputSchema":{"type":"object","properties":{"eqp":{"type":"string","minLength":1,"maxLength":64}},"required":["eqp"],"additionalProperties":false},"outputSchema":{"type":"object"},"requiredPermissions":["EQP_READ"],"timeoutMs":10000}
          - {"id":"tc.model.read","description":"모델 조회","inputSchema":{"type":"object","properties":{"eqp":{"type":["string","null"],"minLength":1,"maxLength":64}},"required":[],"additionalProperties":false},"outputSchema":{"type":"object"},"requiredPermissions":["MODEL_READ"],"timeoutMs":10000}
          - {"id":"tc.dlq.list","description":"DLQ 목록 조회","inputSchema":{"type":"object","properties":{"eqp":{"type":["string","null"],"minLength":1,"maxLength":64},"from":{"type":["string","null"],"minLength":1,"maxLength":35},"to":{"type":["string","null"],"minLength":1,"maxLength":35}},"required":[],"additionalProperties":false},"outputSchema":{"type":"object"},"requiredPermissions":["DLQ_READ"],"timeoutMs":10000}
          - {"id":"tc.commLogs.search","description":"설비별 Gateway·Business 통신 로그와 Source별 보존 완전성 조회","inputSchema":{"type":"object","properties":{"eqp":{"type":"string","minLength":1,"maxLength":64},"from":{"type":"string","minLength":1,"maxLength":35},"to":{"type":"string","minLength":1,"maxLength":35}},"required":["eqp","from","to"],"additionalProperties":false},"outputSchema":{"type":"object"},"requiredPermissions":["COMM_LOG_READ"],"timeoutMs":10000}
        documents:
          - bucket: nori-tc
            prefix: 00.rag/user/
            requiredPermissions: [AI_DOC_READ]
          - bucket: nori-tc
            prefix: 00.rag/admin/
            requiredPermissions: [AI_DOC_READ, AI_ADMIN_DOC_READ]
        apps:
          - {name: tc-gateway, namespace: tc, requiredPermissions: [AI_LOG_READ]}
          - {name: tc-business, namespace: tc, requiredPermissions: [AI_LOG_READ]}
          - {name: tc-ui-backend, namespace: tc, requiredPermissions: [AI_LOG_READ]}
          - {name: tc-ui-front, namespace: tc, requiredPermissions: [AI_LOG_READ]}
        traces:
          - {service: tc-gateway, namespace: tc, requiredPermissions: [AI_TRACE_READ]}
          - {service: tc-business, namespace: tc, requiredPermissions: [AI_TRACE_READ]}
          - {service: tc-ui-backend, namespace: tc, requiredPermissions: [AI_TRACE_READ]}
        repositories:
          - {projectId: "26", ref: main, pathPrefix: common, requiredPermissions: [AI_CODE_READ]}
          - {projectId: "26", ref: main, pathPrefix: db, requiredPermissions: [AI_CODE_READ]}
          - {projectId: "26", ref: main, pathPrefix: messaging, requiredPermissions: [AI_CODE_READ]}
          - {projectId: "28", ref: main, pathPrefix: gateway, requiredPermissions: [AI_CODE_READ]}
          - {projectId: "24", ref: main, pathPrefix: business, requiredPermissions: [AI_CODE_READ]}
          - {projectId: "31", ref: main, pathPrefix: ui, requiredPermissions: [AI_CODE_READ]}
          - {projectId: "32", ref: main, pathPrefix: src, requiredPermissions: [AI_CODE_READ]}
        glossary: {}
    documents:
      s3Endpoint: http://192.168.0.203:8333
      accessKeyFile: ${AI_GATEWAY_S3_ACCESS_KEY_FILE:/app/config/access-key}
      secretKeyFile: ${AI_GATEWAY_S3_SECRET_KEY_FILE:/app/config/secret-key}
      maxFileBytes: 1048576
      childMaxChars: 200
      parentMaxChars: 450
      headingMaxChars: 60
    classification:
      historyPairs: 2
    search:
      semanticCandidates: 20
      keywordCandidates: 20
      identifierCandidates: 20
      rrfK: 60
      evidenceLimit: 6
      verifiedCandidates: 3
      verifiedMinCosine: 0.90
      minSemanticCosine: 0.35
      coreTermLimit: 4
      retryCount: 1
    llm:
      baseUrl: http://192.168.0.77:11434/v1
      generationModel: qwen3-vl:30b-a3b-instruct-q4_K_M
      embeddingModel: bge-m3:latest
      temperature: 0.0
      contextTokens: 8192
      requestTimeout: 60s
      generationConcurrency: 1
      evidenceTokens: 3072
      budgets:
        classify: {inputTokens: 5120, answerTokens: 768, thinkingTokens: 1280, reserveTokens: 1024}
        compose: {inputTokens: 4608, answerTokens: 1536, thinkingTokens: 1536, reserveTokens: 512}
      tokenCounting:
        mode: hf
        tokenizerFile: ${AI_GATEWAY_TOKENIZER_FILE:modules/adapter/ai-gateway-inference-adapter/src/main/resources/tokenizer/qwen3-4b-thinking-2507.tokenizer.json}
        sha256: aeb13307a71acd8fe81861d94ad54ab689df773318809eed3cbe794b4492dae4
        template:
          systemPrefix: "<|im_start|>system\n"
          userPrefix: "<|im_start|>user\n"
          assistantPrefix: "<|im_start|>assistant\n"
          messageSuffix: "<|im_end|>\n"
          sameRoleSeparator: "\n\n"
          mergeSameRole: true
          generationPrefix: "<|im_start|>assistant\n"
          systemContentSuffix: ""
          contentSuffix: ""
