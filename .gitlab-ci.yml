stages: [check, package, build, scan, migrate, deploy]
variables:
  HARBOR_REGISTRY: harbor.nori.local
  HARBOR_PROJECT: nori-tc
  IMAGE_NAME: $HARBOR_REGISTRY/$HARBOR_PROJECT/ai-gateway
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  NAMESPACE: tc
  GITLAB_BASE_URL: "https://gitlab.noricloud.org"

# 기존 GitLab 호스트 경계는 유지합니다.
workflow:
  rules:
    - if: '$CI_SERVER_HOST == "gitlab.noricloud.org"'
    - when: never

test:
  stage: check
  tags: [nori-msa]
  image: harbor.nori.local/library/maven:3.9-eclipse-temurin-21
  # 4Gi에서 OOMKilled(exit 137). 힙 상한(데몬 1g·test 1g)을 둔 로컬 build의 java RSS 합 최대가 3,975MB였다.
  variables:
    KUBERNETES_MEMORY_REQUEST: "5Gi"
    KUBERNETES_MEMORY_LIMIT: "5Gi"
  script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.noricloud.org/norisystem/nori-tc/nori-common.git ../nori-common
    - bash ./gradlew build --no-daemon
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

helm-validate:
  stage: check
  tags: [nori-msa]
  image: harbor.nori.local/library/kubectl:1.32.2
  script:
    - helm lint operations/deploy/helm/ai-gateway -f operations/deploy/helm/ai-gateway/values.yaml -f operations/deploy/helm/ai-gateway/values-prod.yaml --set-file appConfig=config/ai-gateway.yaml --set-string app.imageTag=$IMAGE_TAG
    - helm template ai-gateway operations/deploy/helm/ai-gateway --namespace $NAMESPACE -f operations/deploy/helm/ai-gateway/values.yaml -f operations/deploy/helm/ai-gateway/values-prod.yaml --set-file appConfig=config/ai-gateway.yaml --set-string app.imageTag=$IMAGE_TAG > /dev/null
    - |
      set -eu
      chart=operations/deploy/helm/ai-gateway
      helm template ai-gateway "$chart" --namespace "$NAMESPACE" -f "$chart/values.yaml" -f "$chart/ci/values.yaml" --set-file appConfig="$chart/ci/app-config.yaml" --set-string app.imageTag="$IMAGE_TAG" > chart-fixture.yaml
      awk -f "$chart/ci/assert-network-policy.awk" chart-fixture.yaml
      if grep -Eq 'backend-(in|e)gress: D|ns-d' chart-fixture.yaml; then exit 1; fi
      # 각 실패는 별도 렌더에서 관측합니다.
      if helm template ai-gateway "$chart" -f "$chart/values.yaml" -f "$chart/values-prod.yaml" --set-string app.imageTag="$IMAGE_TAG" > /dev/null 2>&1; then exit 1; fi
      if helm template ai-gateway "$chart" -f "$chart/values.yaml" -f "$chart/ci/values.yaml" --set-file appConfig="$chart/ci/app-config.yaml" --set-string app.imageTag="$IMAGE_TAG" --set systems.EXTRA.backend.namespace=ns-extra --set systems.EXTRA.backend.podSelector.app=extra > /dev/null 2>&1; then exit 1; fi
      # Helm의 map 병합으로 {}가 기존 대상을 남기지 않도록 null로 제거합니다.
      if helm template ai-gateway "$chart" -f "$chart/values.yaml" -f "$chart/ci/values.yaml" --set-file appConfig="$chart/ci/app-config.yaml" --set-string app.imageTag="$IMAGE_TAG" --set netpol.targets=null > /dev/null 2>&1; then exit 1; fi
      for endpoint in llm s3; do
        case "$endpoint" in
          llm) sed 's@http://192.0.2.77:11434/v1@http://llm.example:11434/v1@' "$chart/ci/app-config.yaml" > invalid-app-config.yaml ;;
          s3) sed 's@http://192.0.2.203:8333@http://s3.example:8333@' "$chart/ci/app-config.yaml" > invalid-app-config.yaml ;;
        esac
        if helm template ai-gateway "$chart" -f "$chart/values.yaml" -f "$chart/ci/values.yaml" --set-file appConfig=invalid-app-config.yaml --set-string app.imageTag="$IMAGE_TAG" > /dev/null 2>&1; then exit 1; fi
      done
      rm chart-fixture.yaml invalid-app-config.yaml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

package:
  stage: package
  tags: [nori-msa]
  image: harbor.nori.local/library/maven:3.9-eclipse-temurin-21
  script:
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.noricloud.org/norisystem/nori-tc/nori-common.git ../nori-common
    - bash ./gradlew :apps:ai-gateway-app:bootJar --no-daemon
    # bootJar는 GitLab job artifact 기본 상한 100MB를 넘으므로 이 프로젝트 Generic 패키지 저장소의 고정 이름으로 넘깁니다.
    # 같은 이름 파일은 프로젝트 정리 정책(중복 1개 유지)이 지우고, build는 아래 SHA-256과 대조합니다.
    - |
      set -eu
      set -- modules/apps/ai-gateway-app/build/libs/*.jar
      test "$#" -eq 1
      sha=$(sha256sum "$1")
      echo "APP_JAR_SHA256=${sha%% *}" > package.env
      curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$1" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ai-gateway-app/ci/app.jar"
  artifacts:
    reports:
      dotenv: package.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

build:
  stage: build
  needs: ["package"]
  tags: [nori-msa]
  image:
    name: harbor.nori.local/library/kaniko:debug
    entrypoint: [""]
  script:
    # 다른 파이프라인이 같은 이름으로 더 늦게 올렸으면 해시가 달라 이미지를 만들지 않습니다.
    - |
      set -e
      wget --header "JOB-TOKEN: $CI_JOB_TOKEN" -O app.jar "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ai-gateway-app/ci/app.jar"
      test -n "$APP_JAR_SHA256"
      echo "$APP_JAR_SHA256  app.jar" > app.jar.sha256
      sha256sum -c app.jar.sha256
    - /kaniko/executor
      --context $CI_PROJECT_DIR
      --dockerfile $CI_PROJECT_DIR/operations/deploy/docker/Dockerfile-ci
      --destination $IMAGE_NAME:$IMAGE_TAG
      --destination $IMAGE_NAME:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

scan:
  stage: scan
  needs: ["build"]
  tags:
    - nori-msa
  image:
    name: harbor.nori.local/library/trivy:latest
    entrypoint: [""]
  variables:
    TRIVY_SEVERITY: "HIGH,CRITICAL"
    TRIVY_EXIT_CODE: "1"
    # 자체서명 Harbor(nori.local 사설 CA) 신뢰. SSL_CERT_FILE(시스템 풀 대체)이 아니라
    # SSL_CERT_DIR(추가)라 trivy 의 공개 vuln DB(mirror.gcr.io) 다운로드 TLS 도 그대로 유지된다.
    SSL_CERT_DIR: "/etc/ssl/certs:/tmp/extra-certs"
    # 스캔 대상 이미지 pull 인증: 러너가 /kaniko/.docker 에 마운트한 harbor-creds-secret(config.json) 재사용.
    DOCKER_CONFIG: "/kaniko/.docker"
  before_script:
    # HARBOR_CA_CERT = File 타입 CI 변수(nori.local CA PEM). Go 가 스캔하는 디렉터리에 배치.
    - mkdir -p /tmp/extra-certs
    - cp "$HARBOR_CA_CERT" /tmp/extra-certs/nori-local-ca.crt
  script:
    - trivy image --severity "$TRIVY_SEVERITY" --exit-code "$TRIVY_EXIT_CODE" --ignore-unfixed --no-progress "$IMAGE_NAME:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

migrate:
  stage: migrate
  tags: [nori-msa]
  needs: ["scan"]
  image: harbor.nori.local/library/maven:3.9-eclipse-temurin-21
  allow_failure: false
  variables:
    AI_GATEWAY_DB_URL: "jdbc:postgresql://192.168.0.150:15432/nori_ai_gateway"
  script:
    - 'if [ -z "$AI_GATEWAY_DB_USER" ] || [ -z "$AI_GATEWAY_DB_PASSWORD" ]; then echo "AI_GATEWAY_DB_USER·AI_GATEWAY_DB_PASSWORD를 protected CI 변수로 등록해야 합니다" >&2; exit 1; fi'
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.noricloud.org/norisystem/nori-tc/nori-common.git ../nori-common
    - bash ./gradlew flywayInfo -q --no-daemon
    - bash ./gradlew flywayMigrate --no-daemon
    - bash ./gradlew flywayInfo -q --no-daemon > flyway-info-after.txt
    - 'if grep -q "Pending" flyway-info-after.txt; then echo "flywayMigrate 뒤 Pending이 남았습니다" >&2; exit 1; fi'
  artifacts:
    when: always
    paths: [flyway-info-after.txt]
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# 1800초 startupProbe 창과 그 뒤 readiness 전환을 기다립니다.
deploy:
  stage: deploy
  needs: ["scan", "migrate"]
  tags: [nori-msa]
  image: harbor.nori.local/library/kubectl:1.32.2
  script:
    - helm upgrade --install ai-gateway operations/deploy/helm/ai-gateway
      --namespace $NAMESPACE
      --set-file appConfig=config/ai-gateway.yaml
      --set-string app.imageTag=$IMAGE_TAG
      -f operations/deploy/helm/ai-gateway/values.yaml
      -f operations/deploy/helm/ai-gateway/values-prod.yaml
      --wait
      --timeout 2100s
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_TAG'
      when: manual
